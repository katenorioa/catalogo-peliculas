<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detail - ' + ${pelicula.titulo}">Movie Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 min-h-screen p-6 md:p-12 pb-24 font-sans transition-colors duration-300">

<div class="max-w-5xl mx-auto">

    <!-- Header + Theme Toggle -->
    <div class="mb-8 flex items-center justify-between">
        <div>
            <span class="text-xs font-bold uppercase tracking-widest text-red-600 dark:text-red-500">PostgreSQL Database</span>
            <h1 class="text-3xl font-extrabold mt-1" th:text="${pelicula.titulo}">Movie Title</h1>
        </div>
        <button onclick="cambiarTema()" type="button"
                class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-800 shadow-sm text-sm font-semibold transition">
            <span id="icono-tema">☀️</span>
            <span id="texto-tema">Light Mode</span>
        </button>
    </div>

    <!-- Success Alert -->
    <div th:if="${param.exito}"
         class="mb-6 bg-emerald-100 dark:bg-emerald-950/80 border border-emerald-500 text-emerald-800 dark:text-emerald-200 px-4 py-3 rounded-xl flex items-center justify-between shadow">
        <span class="text-sm font-medium">✓ Details and classification successfully updated in PostgreSQL.</span>
    </div>

    <!-- Main Container -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 bg-white dark:bg-zinc-900 p-6 md:p-8 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-xl">

        <!-- Left Column: Current Image -->
        <div class="md:col-span-4 flex flex-col gap-4">
            <div class="rounded-xl overflow-hidden border border-slate-300 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-800 shadow-md">
                <img id="preview-detalle" th:src="${pelicula.imagenUrl}" alt="Cover" class="w-full h-auto object-cover">
            </div>

            <div class="bg-slate-50 dark:bg-zinc-950/60 p-4 rounded-xl border border-slate-200 dark:border-zinc-800/80 text-xs text-slate-500 dark:text-zinc-400 space-y-1.5">
                <p><strong class="text-slate-700 dark:text-zinc-200">Current Status:</strong>
                    <span th:text="${pelicula.estadoVisualizacion != null ? pelicula.estadoVisualizacion : 'Undefined'}" class="text-amber-500 dark:text-amber-400 font-semibold"></span>
                </p>
            </div>
        </div>

        <!-- Right Column: Form -->
        <div class="md:col-span-8">
            <form th:action="@{/peliculas/actualizar/{id}(id=${pelicula.id})}" th:object="${pelicula}" method="post" enctype="multipart/form-data" class="space-y-5">

                <!-- Title & Optional Poster Replacement -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Title</label>
                        <input type="text" th:field="*{titulo}" required
                               class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white px-4 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Change Poster (Optional)</label>
                        <input type="file" name="archivoImagen" accept="image/*"
                               onchange="previsualizarCambio(this)"
                               class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 px-3 py-2 rounded-lg border border-slate-300 dark:border-zinc-700 text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer">
                    </div>
                </div>

                <!-- Description / Synopsis -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Description / Synopsis</label>
                    <textarea rows="4" th:field="*{descripcion}" required
                              class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white px-4 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm leading-relaxed"></textarea>
                </div>

                <!-- Director & Year -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Director</label>
                        <input type="text" th:field="*{director}" placeholder="Ex. Sam Raimi, John Carpenter..."
                               class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Release Year</label>
                        <input type="number" th:field="*{anioLanzamiento}" placeholder="Ex. 1991"
                               class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm">
                    </div>
                </div>

                <!-- Genre, Rating & Status -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Genre</label>
                        <select th:field="*{genero}"
                                class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white px-3 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm">
                            <option value="">-- Unclassified --</option>
                            <option value="Action / Martial Arts">Action / Martial Arts</option>
                            <option value="Horror / Gothic">Horror / Gothic</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Drama">Drama</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Animation">Animation</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Rating (1-10)</label>
                        <input type="number" step="0.1" min="1" max="10" th:field="*{calificacion}" placeholder="Ex. 8.5"
                               class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">Status</label>
                        <select th:field="*{estadoVisualizacion}"
                                class="w-full bg-slate-50 dark:bg-zinc-800 text-slate-900 dark:text-white px-3 py-2.5 rounded-lg border border-slate-300 dark:border-zinc-700 focus:outline-none focus:border-red-600 text-sm">
                            <option value="Pending">Pending to watch</option>
                            <option value="Watched">Watched</option>
                            <option value="Favorite">Favorite ★</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-red-900/20 transition duration-200">
                        Save and Update
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

<!-- FIXED BACK BUTTON -->
<a th:href="@{/peliculas}"
   class="fixed bottom-8 right-8 z-50 flex items-center gap-2 bg-slate-800 dark:bg-zinc-800 hover:bg-slate-700 dark:hover:bg-zinc-700 text-white font-semibold px-6 py-3 rounded-full border border-slate-600 dark:border-zinc-600 shadow-2xl transition-all duration-200 hover:scale-105">
    <span>←</span>
    <span>Back</span>
</a>

<script>
    function previsualizarCambio(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview-detalle').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function actualizarBotonTema() {
        const esOscuro = document.documentElement.classList.contains('dark');
        document.getElementById('icono-tema').textContent = esOscuro ? '☀️' : '🌙';
        document.getElementById('texto-tema').textContent = esOscuro ? 'Light Mode' : 'Dark Mode';
    }
    actualizarBotonTema();

    function cambiarTema() {
        const html = document.documentElement;
        html.classList.toggle('dark');
        localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        actualizarBotonTema();
    }
</script>

</body>
</html>
